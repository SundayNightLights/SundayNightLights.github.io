
<script>
(() => {
  'use strict';

  if (
    (document.body.dataset.page || 'home') !== 'home'
  ) return;

  const STATS_URL =
    'https://sundaynightlights.github.io/SNL-Stats-Hub/stats-data.json';

  const SCHEDULE_URL =
    'https://sundaynightlights.github.io/SNL-Calendar-Hub/site-data.json';

  const categories = [
    'AVG',
    'HR',
    'RBI',
    'H'
  ];

  async function readJSON(url) {
    const response = await fetch(url, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(
        'HTTP ' + response.status
      );
    }

    return response.json();
  }

  function value(player, key) {
    const raw = player?.stats?.[key];

    if (
      raw === null ||
      raw === undefined ||
      raw === ''
    ) return null;

    const number = Number(raw);

    return Number.isFinite(number)
      ? number
      : null;
  }

  function torontoToday() {
    const parts = new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'America/Toronto',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    ).formatToParts(new Date());

    const date = Object.fromEntries(
      parts.map(p => [p.type, p.value])
    );

    return (
      date.year + '-' +
      date.month + '-' +
      date.day
    );
  }

  function matchingGames(
    currentSeason,
    scheduleData
  ) {
    const games =
      scheduleData?.regularSeason;

    if (
      !Array.isArray(games) ||
      !games.length
    ) return null;

    const dates = games
      .map(g => g.date)
      .filter(d =>
        /^\d{4}-\d{2}-\d{2}$/.test(d)
      )
      .sort();

    const firstDate = dates[0];

    const code = /^([FW])(\d{2})$/i.exec(
      currentSeason.season_id || ''
    );

    if (!firstDate || !code) {
      return null;
    }

    const year =
      2000 + Number(code[2]);

    const startYear =
      Number(firstDate.slice(0, 4));

    const month =
      Number(firstDate.slice(5, 7));

    const sameYear =
      startYear === year;

    const sameSession =
      code[1].toUpperCase() === 'F'
        ? month >= 8
        : month <= 6;

    return sameYear && sameSession
      ? games
      : null;
  }

  function minimumGames(
    currentSeason,
    scheduleData
  ) {
    const games = matchingGames(
      currentSeason,
      scheduleData
    );

    if (games) {
      const today = torontoToday();

      const playedWeeks = new Set(
        games
          .filter(g => {
            const week = Number(g.week);

            return (
              Number.isInteger(week) &&
              week >= 1 &&
              week <= 10 &&
              typeof g.date === 'string' &&
              g.date < today
            );
          })
          .map(g => Number(g.week))
      );

      return Math.min(
        10,
        Math.max(1, playedWeeks.size)
      );
    }

    // Fallback when a matching season
    // schedule is not yet available.

    const maxGP = Math.max(
      0,
      ...currentSeason.players.map(
        p => value(p, 'GP') ?? 0
      )
    );

    return Math.min(
      10,
      Math.max(1, Math.ceil(maxGP / 2))
    );
  }

  function bestPlayer(
    players,
    key,
    minimumGP
  ) {
    const qualified = players.filter(
      player => {
        const number = value(
          player,
          key
        );

        if (number === null) {
          return false;
        }

        if (key === 'AVG') {
          return (
            (value(player, 'GP') ?? 0)
              >= minimumGP
          );
        }

        return true;
      }
    );

    qualified.sort((a, b) => {
      const aValue = value(a, key);
      const bValue = value(b, key);

      return (
        bValue - aValue ||
        String(a.name || '')
          .localeCompare(
            String(b.name || '')
          )
      );
    });

    const top = qualified[0];

    if (!top) return null;

    if (
      key !== 'AVG' &&
      value(top, key) <= 0
    ) {
      return null;
    }

    return top;
  }

  function showCard(
    card,
    key,
    player,
    minimumGP
  ) {
    const abbreviation =
      card.querySelector('small');

    const number =
      card.querySelector('strong');

    const name =
      card.querySelector('span');

    if (
      !abbreviation ||
      !number ||
      !name
    ) return;

    abbreviation.textContent =
      key === 'AVG'
        ? `AVG · MIN ${minimumGP} GP`
        : key;

    if (!player) {
      number.textContent = '—';

      name.textContent =
        key === 'AVG'
          ? 'No qualified players yet'
          : 'No recorded stats yet';

      return;
    }

    const result = value(
      player,
      key
    );

    number.textContent =
      key === 'AVG'
        ? result.toFixed(3)
        : String(result);

    name.textContent =
      `${player.name} · ${player.team}`;
  }

  async function populateHomeLeaders(
    cards
  ) {
    try {
      const results =
        await Promise.allSettled([
          readJSON(STATS_URL),
          readJSON(SCHEDULE_URL)
        ]);

      const statsResult = results[0];
      const scheduleResult = results[1];

      if (
        statsResult.status !== 'fulfilled'
      ) {
        throw statsResult.reason;
      }

      const statsData =
        statsResult.value;

      const currentSeason =
        statsData.seasons?.find(
          s =>
            s.season_id ===
            statsData.current_season
        ) ||
        statsData.seasons?.[0];

      if (
        !currentSeason ||
        !Array.isArray(
          currentSeason.players
        )
      ) {
        throw new Error(
          'Invalid SNL Stats Hub data'
        );
      }

      const scheduleData =
        scheduleResult.status === 'fulfilled'
          ? scheduleResult.value
          : null;

      const minimumGP = minimumGames(
        currentSeason,
        scheduleData
      );

      categories.forEach((key, i) => {
        const winner = bestPlayer(
          currentSeason.players,
          key,
          minimumGP
        );

        showCard(
          cards[i],
          key,
          winner,
          minimumGP
        );
      });

    } catch (error) {
      console.warn(
        'Unable to load SNL homepage leaders:',
        error
      );

      cards.forEach(card => {
        const name =
          card.querySelector('span');

        if (name) {
          name.textContent =
            'Statistics temporarily unavailable';
        }
      });
    }
  }

  function start() {
    const app =
      document.getElementById('app');

    if (!app) return;

    // Wait until the SNL homepage
    // finishes rendering its four tiles.

    const observer =
      new MutationObserver(() => {
        const cards = [
          ...app.querySelectorAll(
            '.leader-cards .leader-card'
          )
        ];

        if (cards.length !== 4) {
          return;
        }

        observer.disconnect();

        populateHomeLeaders(cards);
      });

    observer.observe(app, {
      childList: true,
      subtree: true
    });

    const existingCards = [
      ...app.querySelectorAll(
        '.leader-cards .leader-card'
      )
    ];

    if (existingCards.length === 4) {
      observer.disconnect();

      populateHomeLeaders(
        existingCards
      );
    }
  }

  if (
    document.readyState === 'loading'
  ) {
    document.addEventListener(
      'DOMContentLoaded',
      start,
      { once: true }
    );
  } else {
    start();
  }

})();
</script>
