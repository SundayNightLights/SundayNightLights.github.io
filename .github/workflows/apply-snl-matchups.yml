name: Apply Approved SNL Matchup Cards
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bundled matchup update
        run: |
          python3 - <<'PYX'
          import zipfile
          with zipfile.ZipFile('snl-matchup-update.zip') as z:
              z.extractall('.')
          PYX
          python3 .snl-matchup-kit/apply.py
          rm -rf .snl-matchup-kit
      - name: Commit approved matchup card changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/style.css js/main.js assets/matchup-*.webp
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply approved SNL matchup-card designs'
            git push
          fi
