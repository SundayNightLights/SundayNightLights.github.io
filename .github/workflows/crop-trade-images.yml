name: Create original-photo transparent trade cutouts

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/crop-trade-images.py
      - .github/workflows/crop-trade-images.yml

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Generate cutouts from original source photos
        run: python scripts/crop-trade-images.py
      - name: Commit preview PNGs (not used by the live site yet)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trade-derek-cutout.png assets/trade-alfred-cutout.png assets/trade-derek-cutout-preview.jpg assets/trade-alfred-cutout-preview.jpg assets/trade-derek-layout-preview.jpg assets/trade-alfred-layout-preview.jpg
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Generate transparent original-player preview cutouts"
            git push
          fi
