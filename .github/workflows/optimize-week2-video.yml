name: Optimize SNL Week 2 highlights MP4
on:
  push:
    paths:
      - ".github/workflows/optimize-week2-video.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snl-highlight-video-optimization
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check source and encoder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/week3-highlight.mp4)" = "e9342c0fb613ce650bc43900f405ee9760287539" || {
            echo "Source file has changed; refusing to overwrite it."
            exit 1
          }
          command -v ffmpeg
          command -v ffprobe
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json assets/week3-highlight.mp4
      - name: Encode high-quality H.264 candidates and measure visual similarity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/snl-video
          : > /tmp/snl-video/results.tsv
          for crf in 21 23 25; do
            target="/tmp/snl-video/try-${crf}.mp4"
            ffmpeg -nostdin -hide_banner -loglevel error -y \
              -i assets/week3-highlight.mp4 \
              -map 0:v:0 -map 0:a? -map_metadata 0 \
              -c:v libx264 -preset slow -crf "${crf}" -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart \
              "${target}"
            sslog="/tmp/snl-video/ssim-${crf}.log"
            ffmpeg -nostdin -hide_banner -i assets/week3-highlight.mp4 -i "${target}" \
              -lavfi ssim -an -f null - > "${sslog}" 2>&1
            similarity="$(grep -oE 'All:[0-9.]+' "${sslog}" | tail -n 1 | cut -d: -f2)"
            test -n "${similarity}"
            bytes="$(stat -c%s "${target}")"
            printf '%s\t%s\t%s\n' "${crf}" "${bytes}" "${similarity}" >> /tmp/snl-video/results.tsv
          done
          echo "Compression candidates: CRF / bytes / SSIM"
          cat /tmp/snl-video/results.tsv
      - name: Select best candidate without sacrificing noticeable quality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil
          original = os.path.getsize('assets/week3-highlight.mp4')
          candidates = []
          for line in open('/tmp/snl-video/results.tsv'):
              crf, size, similarity = line.strip().split('\t')
              crf, size, similarity = int(crf), int(size), float(similarity)
              candidates.append((size, crf, similarity))
          print(f"Original: {original} bytes")
          for size, crf, similarity in candidates:
              print(f"CRF {crf}: {size} bytes, {size/original:.1%} of original, SSIM {similarity:.4f}")
          eligible = sorted(c for c in candidates if c[0] <= original*0.85 and c[2] >= 0.975)
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary,'a') as f:
              f.write('## SNL Week 2 highlight compression\n\n')
              f.write(f'Original: **{original/1048576:.2f} MiB**\n\n')
              for size,crf,ssim in candidates:
                  f.write(f'- CRF {crf}: {size/1048576:.2f} MiB, SSIM {ssim:.4f}\n')
              if eligible:
                  size, crf, ssim = eligible[0]
                  shutil.copyfile(f'/tmp/snl-video/try-{crf}.mp4', 'assets/week3-highlight.mp4')
                  f.write(f'\n**Selected CRF {crf}: {size/1048576:.2f} MiB, reduction {(1-size/original):.1%}, SSIM {ssim:.4f}.**\n')
                  open('/tmp/snl-video/selected','w').write(f'{crf} {size} {ssim}\n')
                  print('Selected CRF',crf)
              else:
                  f.write('\nNo candidate met both requirements: at least 15% size reduction and SSIM >=0.975. Original retained.\n')
                  print('No safe candidate. Original retained.')
          PY
      - name: Publish optimized video and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/snl-video/selected; then
            ffprobe -v error -show_entries format=duration,size -of json assets/week3-highlight.mp4
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-week2-video.yml
          git add assets/week3-highlight.mp4
          git diff --cached --stat
          git commit -m "Optimize SNL highlight MP4 for web playback"
          git fetch origin main
          test "$(git rev-parse origin/main:assets/week3-highlight.mp4)" = "e9342c0fb613ce650bc43900f405ee9760287539" || {
            echo "Video changed upstream during optimization; refusing to publish."
            exit 1
          }
          git rebase origin/main
          git push origin HEAD:main
