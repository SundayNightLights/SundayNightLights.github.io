<div id="siteHeader"></div>
<main id="app"></main>

<script src="js/data.js?v=snl-content-20261104"></script>
<script src="js/main.js?v=snl-content-20261104"></script>

<script>
(() => {
  'use strict';

  const FEED =
    'https://sundaynightlights.github.io/SNL-Stats-Hub/stats-data.json';

  const SCHEDULE_FEED =
    '/SNL-Calendar-Hub/site-data.json';

  const stats = [
    'GP','PA','AVG','OBP','SLG','OPS',
    'H','2B','3B','HR','RBI'
  ];

  const rateStats = new Set([
    'AVG','OBP','SLG','OPS'
  ]);

  const categories = [
    ['AVG','Batting Average'],
    ['OBP','On-Base Percentage'],
    ['SLG','Slugging'],
    ['OPS','On-Base + Slugging'],
    ['H','Hits'],
    ['HR','Home Runs'],
    ['RBI','Runs Batted In'],
    ['2B','Doubles']
  ];

  let data = null;
  let schedule = null;
  let section = null;

  function create(tag, content, className = '') {
    const node = document.createElement(tag);

    if (content !== undefined) {
      node.textContent = String(content);
    }

    if (className) node.className = className;

    return node;
  }

  function byId(id) {
    return section.querySelector('#' + id);
  }

  function stat(player, key) {
    const value = player.stats?.[key];

    return typeof value === 'number' &&
      Number.isFinite(value) ? value : null;
  }

  function fmt(player, key) {
    const value = stat(player, key);

    if (value === null) return '—';

    return rateStats.has(key)
      ? value.toFixed(3)
      : String(value);
  }

  function currentSeason() {
    return data?.seasons.find(
      s => s.season_id === byId('gcSeason').value
    );
  }

  function sorted(players, key) {
    return [...players].sort((a,b) => {
      const x = stat(a,key);
      const y = stat(b,key);

      if (x === null) return y === null ? 0 : 1;
      if (y === null) return -1;

      return y - x ||
        String(a.name).localeCompare(String(b.name));
    });
  }

  function torontoToday() {
    const parts = new Intl.DateTimeFormat(
      'en-US', {
        timeZone:'America/Toronto',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).formatToParts(new Date());

    const p = Object.fromEntries(
      parts.map(part => [part.type, part.value])
    );

    return `${p.year}-${p.month}-${p.day}`;
  }

  // Find the schedule matching the selected season.
  function matchingSchedule(season) {
    const games = schedule?.regularSeason;

    if (!Array.isArray(games) || !games.length) {
      return null;
    }

    const dates = games
      .map(g => g.date)
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d))
      .sort();

    const firstDate = dates[0];

    const code = /^([FW])(\d{2})$/i.exec(
      season.season_id || ''
    );

    if (!firstDate || !code) return null;

    const year = 2000 + Number(code[2]);
    const startYear = Number(firstDate.slice(0,4));
    const month = Number(firstDate.slice(5,7));

    const matches =
      startYear === year &&
      (
        code[1].toUpperCase() === 'F'
          ? month >= 8
          : month <= 6
      );

    return matches ? games : null;
  }

  // Progressive qualification:
  // Week 1 = 1 GP ... Week 10 = 10 GP.
  function requiredGames(season) {
    if (data?.current_season !== season.season_id) {
      return {
        minimum:10,
        method:'final'
      };
    }

    const games = matchingSchedule(season);

    if (games) {
      const completedWeeks = new Set(
        games
          .filter(g =>
            Number.isInteger(g.week) &&
            g.week >= 1 &&
            g.week <= 10 &&
            typeof g.date === 'string' &&
            g.date < torontoToday()
          )
          .map(g => g.week)
      );

      return {
        minimum:Math.min(
          10,
          Math.max(1, completedWeeks.size)
        ),
        method:'schedule'
      };
    }

    // Fallback for future seasons without a schedule:
    // Estimate the current week using reported GP.
    const maxGP = Math.max(
      0,
      ...season.players.map(
        p => stat(p,'GP') ?? 0
      )
    );

    return {
      minimum:Math.min(
        10,
        Math.max(1, Math.ceil(maxGP / 2))
      ),
      method:'estimated'
    };
  }

  function addOption(select, value, label) {
    const option = create('option', label);
    option.value = value;
    select.appendChild(option);
  }

  function renderLeaders(season) {
    const minimum = requiredGames(season).minimum;
    const root = byId('gcLeaderCards');

    root.replaceChildren();

    for (const [key,label] of categories) {
      const eligible = season.players.filter(
        player =>
          stat(player,key) !== null &&
          (
            !rateStats.has(key) ||
            (stat(player,'GP') ?? 0) >= minimum
          )
      );

      const ranked = sorted(eligible,key);

      const hasResults =
        rateStats.has(key) ||
        ranked.some(player => stat(player,key) > 0);

      const leaders = hasResults
        ? ranked.slice(0,3)
        : [];

      const card = create(
        'button',
        undefined,
        'gc-leader'
      );

      card.type = 'button';

      card.appendChild(
        create('span',label,'gc-cat')
      );

      if (rateStats.has(key)) {
        card.appendChild(
          create(
            'span',
            `MIN ${minimum} GP`,
            'gc-qualifier'
          )
        );
      }

      const first = leaders[0];

      card.appendChild(
        create(
          'strong',
          first ? fmt(first,key) : '—',
          'gc-top-value'
        )
      );

      card.appendChild(
        create(
          'span',
          first
            ? first.name
            : rateStats.has(key)
              ? 'No qualified players yet'
              : 'No recorded stats yet',
          'gc-top-player'
        )
      );

      card.appendChild(
        create(
          'span',
          first ? first.team : '',
          'gc-top-team'
        )
      );

      const runners = create(
        'div',
        undefined,
        'gc-runners'
      );

      leaders.slice(1).forEach((player,i) => {
        const row = create(
          'div',
          undefined,
          'gc-runner'
        );

        row.appendChild(
          create('span','#'+(i+2),'gc-rank')
        );

        row.appendChild(
          create(
            'span',
            player.name,
            'gc-runner-name'
          )
        );

        row.appendChild(
          create(
            'span',
            fmt(player,key),
            'gc-runner-value'
          )
        );

        runners.appendChild(row);
      });

      card.appendChild(runners);

      card.addEventListener('click',() => {
        byId('gcSort').value = key;
        renderTable();

        byId('gcBattingSection').scrollIntoView({
          behavior:'smooth',
          block:'start'
        });
      });

      root.appendChild(card);
    }
  }

  function renderTable() {
    const season = currentSeason();
    if (!season) return;

    const team = byId('gcTeam').value;
    const query = byId('gcSearch').value
      .trim()
      .toLowerCase();

    const key = byId('gcSort').value;

    const players = sorted(
      season.players.filter(player =>
        (!team || player.team_id === team) &&
        String(player.name || '')
          .toLowerCase()
          .includes(query)
      ),
      key
    );

    const tbody = byId('gcRows');
    tbody.replaceChildren();

    players.forEach((player,i) => {
      const tr = create('tr');

      tr.appendChild(create('td',i+1));
      tr.appendChild(
        create('td',player.name,'gc-player')
      );
      tr.appendChild(create('td',player.team));

      for (const key of stats) {
        tr.appendChild(
          create(
            'td',
            fmt(player,key),
            rateStats.has(key)
              ? 'gc-num gc-rate'
              : 'gc-num'
          )
        );
      }

      tbody.appendChild(tr);
    });

    if (!players.length) {
      const row = create('tr');
      const cell = create(
        'td',
        'No matching player statistics.'
      );

      cell.colSpan = stats.length + 3;
      row.appendChild(cell);
      tbody.appendChild(row);
    }

    const reporting = season.teams.filter(
      team =>
        team.reporting_status === 'stats_available'
    ).length;

    byId('gcMeta').textContent =
      `${players.length} player records · ` +
      `${reporting} of 6 teams reporting · ` +
      `${season.season_label || season.season_id}`;
  }

  function renderSeason() {
    const season = currentSeason();
    if (!season) return;

    renderLeaders(season);

    const qualification = requiredGames(season);

    byId('gcQualification').textContent =
      `AVG, OBP, SLG and OPS require at least ` +
      `${qualification.minimum} games played. ` +
      `All players remain visible in the full table.` +
      (
        qualification.method === 'estimated'
          ? ' Current threshold is estimated from reported games.'
          : ''
      );

    const teamSelect = byId('gcTeam');
    teamSelect.replaceChildren();

    addOption(teamSelect,'','All Teams');

    season.teams.forEach(team => {
      addOption(
        teamSelect,
        team.team_id,
        team.name
      );
    });

    const report = byId('gcReporting');
    report.replaceChildren();

    season.teams.forEach(team => {
      const card = create(
        'div',
        undefined,
        'gc-team'
      );

      card.appendChild(
        create('strong',team.name)
      );

      const available =
        team.reporting_status === 'stats_available';

      card.appendChild(
        create(
          'span',
          available
            ? 'Stats available'
            : 'Not submitted',
          'gc-state' +
            (available ? ' is-reporting' : '')
        )
      );

      report.appendChild(card);
    });

    renderTable();
  }

  async function loadStats() {
    try {
      const response = await fetch(
        FEED,
        {cache:'no-store'}
      );

      if (!response.ok) {
        throw new Error(
          'Statistics HTTP ' + response.status
        );
      }

      const incoming = await response.json();

      if (!Array.isArray(incoming.seasons) ||
          !incoming.seasons.length) {
        throw new Error('No seasons available');
      }

      data = incoming;

      // Schedule lookup is optional.
      try {
        const response = await fetch(
          SCHEDULE_FEED,
          {cache:'no-store'}
        );

        if (response.ok) {
          schedule = await response.json();
        }
      } catch(error) {
        console.warn(
          'Schedule unavailable for qualification',
          error
        );
      }

      const seasonSelect = byId('gcSeason');
      seasonSelect.replaceChildren();

      data.seasons.forEach(season => {
        addOption(
          seasonSelect,
          season.season_id,
          season.season_label || season.season_id
        );
      });

      seasonSelect.value = data.current_season;

      if (seasonSelect.selectedIndex < 0) {
        seasonSelect.selectedIndex = 0;
      }

      seasonSelect.disabled = false;
      byId('gcTeam').disabled = false;

      if (data.generated_at_utc) {
        const date = new Date(
          data.generated_at_utc
        );

        if (!Number.isNaN(date.getTime())) {
          byId('gcUpdated').textContent =
            'Last processed: ' +
            date.toLocaleString(
              'en-CA',
              {timeZone:'America/Toronto'}
            );
        }
      }

      renderSeason();

    } catch(error) {
      console.error(
        'SNL statistics error:',
        error
      );

      byId('gcMeta').textContent =
        'Player statistics are temporarily unavailable.';

      byId('gcMeta').classList.add(
        'gc-error'
      );

      byId('gcLeaderCards').textContent =
        'League leaders could not be loaded.';
    }
  }

  function mount() {
    const app = document.getElementById('app');

    const wrap = app.querySelector(
      ':scope > .wrap'
    );

    if (!wrap ||
        !wrap.querySelector('.page-hero') ||
        !wrap.querySelector('.footer')) {
      return false;
    }

    const footer = wrap.querySelector('.footer');

    const template = document.createElement(
      'template'
    );

    template.innerHTML = `
      <div class="page-hero">
        <div>
          <h1>PLAYER <em>STATS</em></h1>
          <p>
            GameChanger batting leaders and player statistics
          </p>
        </div>
      </div>

      <div id="gc-stats">

        <div class="gc-seasonbar">
          <label for="gcSeason">
            SEASON
            <select id="gcSeason" disabled>
              <option>Loading seasons…</option>
            </select>
          </label>
          <span class="gc-faint">
            Statistics from participating SNL teams
          </span>
        </div>

        <section class="section">
          <div class="section-top">
            <div>
              <h2>BATTING <em>LEADERS</em></h2>
              <div class="section-rule"></div>
            </div>
            <small>
              CLICK A CATEGORY TO VIEW RANKINGS
            </small>
          </div>

          <div id="gcLeaderCards"
               class="gc-leader-grid"></div>
        </section>

        <section class="section"
                 id="gcBattingSection">

          <div class="section-top">
            <div>
              <h2>
                COMPLETE <em>BATTING STATS</em>
              </h2>
              <div class="section-rule"></div>
            </div>
          </div>

          <div class="gc-filter-grid">

            <label for="gcTeam">
              TEAM
              <select id="gcTeam" disabled>
                <option>All Teams</option>
              </select>
            </label>

            <label for="gcSort">
              SORT BY
              <select id="gcSort">
                <option value="AVG">Batting Average</option>
                <option value="OBP">On-Base Percentage</option>
                <option value="SLG">Slugging</option>
                <option value="OPS">OPS</option>
                <option value="HR">Home Runs</option>
                <option value="RBI">Runs Batted In</option>
                <option value="H">Hits</option>
                <option value="2B">Doubles</option>
                <option value="3B">Triples</option>
                <option value="PA">Plate Appearances</option>
                <option value="GP">Games Played</option>
              </select>
            </label>

            <label for="gcSearch">
              SEARCH PLAYER
              <input id="gcSearch"
                     type="search"
                     placeholder="Player name">
            </label>
          </div>

          <p class="gc-faint"
             id="gcQualification"></p>

          <p class="gc-faint"
             id="gcMeta">
            Loading player statistics…
          </p>

          <div class="gc-table-wrap">
            <table class="gc-table">
              <thead>
                <tr id="gcHeaders"></tr>
              </thead>
              <tbody id="gcRows"></tbody>
            </table>
          </div>

          <p class="gc-note">
            Batting statistics are voluntarily recorded
            by participating GameChanger teams.
            AVG, OBP, SLG and OPS require minimum games
            played to qualify for the leaderboards.
            Everyone remains visible in the full table.
            HR, RBI, H and 2B have no qualification
            requirement.
          </p>

        </section>

        <section class="section gc-section-spaced">
          <div class="section-top">
            <div>
              <h2>TEAM <em>REPORTING</em></h2>
              <div class="section-rule"></div>
            </div>
          </div>

          <div id="gcReporting"
               class="gc-team-list"></div>

          <p class="gc-faint"
             id="gcUpdated"></p>
        </section>

      </div>
    `;

    // Preserve the existing SNL footer.
    // Replace the old standings-based Stats page.
    wrap.replaceChildren(
      template.content,
      footer
    );

    section = wrap.querySelector('#gc-stats');

    const headers = byId('gcHeaders');

    ['#','Player','Team',...stats].forEach(
      (name,i) => {
        headers.appendChild(
          create(
            'th',
            name,
            i >= 3
              ? rateStats.has(name)
                ? 'gc-num gc-rate'
                : 'gc-num'
              : ''
          )
        );
      }
    );

    byId('gcSeason').addEventListener(
      'change',
      renderSeason
    );

    byId('gcTeam').addEventListener(
      'change',
      renderTable
    );

    byId('gcSort').addEventListener(
      'change',
      renderTable
    );

    byId('gcSearch').addEventListener(
      'input',
      renderTable
    );

    loadStats();
    return true;
  }

  // Wait for the original website to render.
  if (!mount()) {
    const app = document.getElementById('app');

    const observer = new MutationObserver(() => {
      if (mount()) observer.disconnect();
    });

    observer.observe(app,{
      childList:true
    });
  }
})();
</script>
</body>
</html>
