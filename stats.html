
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06192b">
<meta name="description" content="Sunday Night Lights batting leaders and player statistics, powered by GameChanger.">
<title>Stats | Sunday Night Lights</title>
<link rel="stylesheet" href="css/style.css?v=scoreboard-brand-snl-20261107"><link rel="stylesheet" href="css/snl-matchups-approved-v4.css?v=morsl-logo-20261105">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
/* These rules only affect the main SNL site's Stats page. */
#gc-stats { color: var(--text, #f7faff); }
#gc-stats select,#gc-stats input {width:100%;min-width:0;padding:10px 12px;border:1px solid #64809c;border-radius:8px;background:#06192b;color:#fff;font:inherit;font-size:13px;}
#gc-stats .gc-faint {color:var(--muted,#a9bfd2);font-size:12px;}
#gc-stats .gc-leader-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:27px;}
#gc-stats .gc-leader {display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0;min-height:218px;padding:16px;background:linear-gradient(150deg,#173b58,#081e33);border:1px solid #4b6b86;border-radius:12px;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s;}
#gc-stats .gc-leader:hover,#gc-stats .gc-leader:focus-visible {border-color:var(--yellow,#ffde19);transform:translateY(-2px);}
#gc-stats .gc-leader:focus-visible {outline:2px solid var(--yellow,#ffde19);outline-offset:2px;}
#gc-stats .gc-qualifier {margin-top:7px;color:#b5cbe0;font-size:10px;font-weight:850;letter-spacing:.035em;}
#gc-stats .gc-cat {font-size:11px;letter-spacing:.075em;font-weight:900;color:#bed1e4;text-transform:uppercase;}
#gc-stats .gc-top-value {font-size:31px;font-weight:1000;line-height:1.18;color:var(--yellow,#ffde19);font-variant-numeric:tabular-nums;margin:12px 0 4px;}
#gc-stats .gc-top-player {font-size:15px;font-weight:900;line-height:1.2;overflow-wrap:anywhere;}
#gc-stats .gc-top-team {font-size:11px;color:#aac0d2;margin-top:4px;}
#gc-stats .gc-runners {margin-top:auto;padding-top:12px;display:grid;gap:5px;}
#gc-stats .gc-runner {display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:5px;align-items:center;border-top:1px solid #37546e;padding-top:5px;font-size:11px;}
#gc-stats .gc-rank {color:#9fb4c9;font-weight:900;}
#gc-stats .gc-runner-name {white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#gc-stats .gc-runner-value {color:#f7faff;font-weight:800;font-variant-numeric:tabular-nums;}
#gc-stats .gc-filter-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;margin:0 0 13px;border:1px solid #486580;border-radius:12px;background:var(--panel2,#0c2943);}
#gc-stats .gc-filter-grid label {display:block;color:#c5d6e6;font-size:12px;font-weight:800;}
#gc-stats .gc-filter-grid label select,#gc-stats .gc-filter-grid label input {display:block;margin-top:7px;}
#gc-stats .gc-leader-note {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px;color:#b9ccdd;font-size:12px;line-height:1.4;}
#gc-stats .gc-leader-note .gc-min-badge {padding:5px 9px;font-size:11px;}
#gc-stats .gc-min-badge {flex-shrink:0;background:#ffde19;color:#06192b;border-radius:7px;padding:8px 12px;font-weight:900;font-size:12px;white-space:nowrap;}
#gc-stats .gc-table-wrap {overflow-x:auto;border:1px solid #486580;border-radius:11px;background:#0b2943;}
#gc-stats .gc-table {width:100%;min-width:880px;border-collapse:collapse;white-space:nowrap;font-size:13px;}
#gc-stats .gc-table th,#gc-stats .gc-table td {padding:12px 11px;border-bottom:1px solid #35536f;text-align:left;}
#gc-stats .gc-table th {background:#173c5b;color:#f7faff;font-size:12px;}
#gc-stats .gc-table .gc-num {text-align:right;font-variant-numeric:tabular-nums;}
#gc-stats .gc-table th.gc-rate {color:var(--yellow,#ffde19);}
#gc-stats .gc-table td.gc-rate,#gc-stats .gc-table td.gc-player {font-weight:850;}
#gc-stats .gc-table tbody tr:hover {background:#193b58;}
#gc-stats .gc-team-list {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0;}
#gc-stats .gc-team {display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 13px;background:var(--panel2,#0c2943);border:1px solid #486580;border-radius:9px;font-size:12px;}
#gc-stats .gc-team strong {font-weight:900;}
#gc-stats .gc-state {font-size:11px;color:#bccfe0;text-align:right;}
#gc-stats .gc-state.is-reporting {color:#a5e9c2;}
#gc-stats .gc-error {color:#ffd0cb;}
#gc-stats .gc-section-spaced {margin-top:30px;}
@media(max-width:1000px) {#gc-stats .gc-leader-grid {grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px) {#gc-stats .gc-filter-grid {grid-template-columns:1fr;}#gc-stats .gc-team-list {grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px) {#gc-stats .gc-leader-grid,#gc-stats .gc-team-list {grid-template-columns:1fr;}#gc-stats .gc-leader {min-height:190px;}}
</style>
</head>
<body data-page="stats">
<div id="siteHeader"></div>
<main id="app"></main>
<script src="js/data.js?v=snl-content-20261104"></script>
<script src="js/main.js?v=scoreboard-brand-snl-20261107"></script>
<script>
(() => {
  'use strict';
  const FEED = 'https://sundaynightlights.github.io/SNL-Stats-Hub/stats-data.json';
  const SCHEDULE_FEED = '/SNL-Calendar-Hub/site-data.json';
  const stats = ['GP','PA','AVG','OBP','SLG','OPS','H','2B','3B','HR','RBI'];
  const rateStats = new Set(['AVG','OBP','SLG','OPS']);
  const categories = [
    ['AVG','Batting Average'], ['OBP','On-Base Percentage'],
    ['SLG','Slugging'], ['OPS','On-Base + Slugging'],
    ['H','Hits'], ['HR','Home Runs'],
    ['RBI','Runs Batted In'], ['2B','Doubles']
  ];
  let data = null;
  let schedule = null;
  let section = null;
  const create = (tag, content, className) => {
    const node = document.createElement(tag);
    if (content !== undefined) node.textContent = String(content);
    if (className) node.className = className;
    return node;
  };
  const byId = id => section.querySelector('#' + id);
  const stat = (p, key) => {
    const value = p.stats?.[key];
    return typeof value === 'number' && Number.isFinite(value) ? value : null;
  };
  const fmt = (p, key) => {
    const value = stat(p, key);
    return value === null ? '—' : rateStats.has(key) ? value.toFixed(3) : String(value);
  };
  const season = () => data?.seasons.find(s => s.season_id === byId('gcSeason').value);
  const sorted = (players, key) => [...players].sort((a,b) => {
    const x = stat(a,key), y = stat(b,key);
    if (x === null) return y === null ? 0 : 1;
    if (y === null) return -1;
    return y - x || String(a.name).localeCompare(String(b.name));
  });

  // League policy: after each completed playing Sunday, require one GP.
  // Ten weeks / twenty scheduled games per club => final minimum ten GP.
  function torontoToday() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone:'America/Toronto', year:'numeric', month:'2-digit', day:'2-digit'
    }).formatToParts(new Date());
    const v = Object.fromEntries(parts.map(p => [p.type,p.value]));
    return `${v.year}-${v.month}-${v.day}`;
  }

  function matchingSchedule(s) {
    const games = schedule?.regularSeason;
    if (!Array.isArray(games) || !games.length) return null;
    const start = games.map(g => g.date).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort()[0];
    const code = /^([FW])(\d{2})$/i.exec(s.season_id || '');
    if (!start || !code) return null;
    const year = 2000 + Number(code[2]);
    const startYear = Number(start.slice(0,4));
    const startMonth = Number(start.slice(5,7));

    // Match the league's season code, not a previous session's calendar.
    const matches = startYear === year &&
      (code[1].toUpperCase() === 'F' ? startMonth >= 8 : startMonth <= 6);
    return matches ? games : null;
  }

  function requiredGames(s) {
    // An archived, completed session retains its final ten-GP requirement.
    if (data?.current_season !== s.season_id) {
      return {minimum:10, method:'final'};
    }
    const games = matchingSchedule(s);
    if (games) {
      const priorWeeks = new Set(games.filter(g =>
        Number.isInteger(g.week) && g.week >= 1 && g.week <= 10 &&
        typeof g.date === 'string' && g.date < torontoToday()
      ).map(g => g.week));
      return {minimum:Math.min(10,Math.max(1,priorWeeks.size)), method:'schedule'};
    }
    // For a session whose calendar isn't available yet, use the two-games-
    // per-week format as an estimate. Never claim this is the official week.
    const maxGP = Math.max(0,...s.players.map(p => stat(p,'GP') ?? 0));
    return {minimum:Math.min(10,Math.max(1,Math.ceil(maxGP / 2))), method:'estimated'};
  }

  const addOption = (select, value, label) => {
    const o = create('option',label); o.value = value; select.appendChild(o);
  };

  function renderLeaders(s) {
    const qualification = requiredGames(s);
    const minimum = qualification.minimum;
    const root = byId('gcLeaderCards');
    root.replaceChildren();

    for (const [key,label] of categories) {
      const ranked = sorted(
        s.players.filter(p =>
          stat(p,key) !== null &&
          (!rateStats.has(key) || (stat(p,'GP') ?? 0) >= minimum)
        ),
        key
      );

      const hasPositive = rateStats.has(key) || ranked.some(p => stat(p,key) > 0);
      const display = hasPositive ? ranked.slice(0,3) : [];
      const card = create('button',undefined,'gc-leader');
      card.type = 'button';
      card.setAttribute('aria-label','Sort batting statistics by '+label);
      card.appendChild(create('span',label,'gc-cat'));

      // The minimum-GP rule is shown once above the leader cards.

      const first = display[0];
      card.appendChild(create('strong',first ? fmt(first,key) : '—','gc-top-value'));
      card.appendChild(create(
        'span',
        first ? first.name : rateStats.has(key) ? 'No qualified players yet' : 'No recorded stats yet',
        'gc-top-player'
      ));
      card.appendChild(create('span',first ? first.team : '','gc-top-team'));

      const runners = create('div',undefined,'gc-runners');
      display.slice(1).forEach((p,i) => {
        const line = create('div',undefined,'gc-runner');
        line.appendChild(create('span','#'+(i+2),'gc-rank'));
        line.appendChild(create('span',p.name,'gc-runner-name'));
        line.appendChild(create('span',fmt(p,key),'gc-runner-value'));
        runners.appendChild(line);
      });
      card.appendChild(runners);

      card.addEventListener('click',() => {
        byId('gcSort').value = key;
        renderTable();
        byId('gcBattingSection').scrollIntoView({
          behavior:'smooth',
          block:'start'
        });
      });
      root.appendChild(card);
    }
  }

  function renderTable() {
    const s = season();
    if (!s) return;
    const team = byId('gcTeam').value;
    const query = byId('gcSearch').value.trim().toLowerCase();
    const key = byId('gcSort').value;
    const players = sorted(
      s.players.filter(p =>
        (!team || p.team_id === team) &&
        String(p.name || '').toLowerCase().includes(query)
      ),
      key
    );
    const tbody = byId('gcRows');
    tbody.replaceChildren();

    for (let i=0;i<players.length;i++) {
      const p = players[i];
      const tr = create('tr');
      tr.appendChild(create('td',i+1));
      tr.appendChild(create('td',p.name,'gc-player'));
      tr.appendChild(create('td',p.team));
      stats.forEach(k =>
        tr.appendChild(
          create('td',fmt(p,k),rateStats.has(k)?'gc-num gc-rate':'gc-num')
        )
      );
      tbody.appendChild(tr);
    }

    if (!players.length) {
      const tr = create('tr');
      const td = create('td','No matching player statistics.');
      td.colSpan = 14;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    const count = s.teams.filter(
      t => t.reporting_status === 'stats_available'
    ).length;

    byId('gcMeta').textContent =
      `${players.length} player records · ${count} of 6 teams reporting · ` +
      `${s.season_label || s.season_id}`;
  }

  function renderSeason() {
    const s = season();
    if (!s) return;
    renderLeaders(s);

    const qualification = requiredGames(s);
    byId('gcQualification').textContent =
      `MIN ${qualification.minimum} GP`;
    byId('gcQualification').title =
      qualification.method === 'estimated'
        ? 'Estimated from reported games until the season schedule is available'
        : '50% of games played to date (rounded up)';

    const teamSelect = byId('gcTeam');
    teamSelect.replaceChildren();
    addOption(teamSelect,'','All Teams');
    s.teams.forEach(t => addOption(teamSelect,t.team_id,t.name));

    const report = byId('gcReporting');
    report.replaceChildren();

    s.teams.forEach(t => {
      const card = create('div',undefined,'gc-team');
      const available = t.reporting_status === 'stats_available';
      card.appendChild(create('strong',t.name));
      card.appendChild(create(
        'span',
        available ? 'Stats available' : 'Not submitted',
        'gc-state' + (available ? ' is-reporting' : '')
      ));
      report.appendChild(card);
    });

    renderTable();
  }

  async function loadStats() {
    try {
      const response = await fetch(FEED,{cache:'no-store'});
      if(!response.ok) throw new Error('HTTP '+response.status);

      const incoming = await response.json();
      if(!Array.isArray(incoming.seasons) || !incoming.seasons.length) {
        throw new Error('No seasons available');
      }

      data = incoming;

      // Read the official playing-week dates for the matching season.
      // A missing calendar never blocks the player statistics feed.
      try {
        const calendarResponse = await fetch(SCHEDULE_FEED,{cache:'no-store'});
        if(calendarResponse.ok) schedule = await calendarResponse.json();
      } catch(error) {
        console.warn('SNL schedule not available for qualification',error);
      }

      const seasons = byId('gcSeason');
      seasons.replaceChildren();
      data.seasons.forEach(s =>
        addOption(seasons,s.season_id,s.season_label || s.season_id)
      );
      seasons.value = data.current_season;
      if(seasons.selectedIndex < 0) seasons.selectedIndex = 0;

      seasons.disabled = false;
      byId('gcTeam').disabled = false;

      const updated = new Date(data.generated_at_utc);
      if(!Number.isNaN(updated.getTime())) {
        byId('gcUpdated').textContent =
          'Last processed: ' +
          updated.toLocaleString('en-CA',{
            timeZone:'America/Toronto'
          });
      }

      renderSeason();
    } catch(error) {
      console.error('SNL GameChanger stats unavailable:',error);
      byId('gcMeta').textContent =
        'Player batting statistics are temporarily unavailable.';
      byId('gcMeta').classList.add('gc-error');
      byId('gcLeaderCards').textContent =
        'The latest league leaders could not be loaded.';
    }
  }

  function mount() {
    const app = document.getElementById('app');
    const wrap = app.querySelector(':scope > .wrap');

    if(
      !wrap ||
      !wrap.querySelector('.page-hero') ||
      !wrap.querySelector('.footer')
    ) {
      return false;
    }

    // Keep the original SNL header/score ticker (outside #app) and footer.
    // Replace ALL original Stats-page content, including duplicate standings.
    const footer = wrap.querySelector('.footer');
    const template = document.createElement('template');

    template.innerHTML = `
      <div class="page-hero">
        <div>
          <h1>PLAYER <em>STATS</em></h1>
        </div>
      </div>

      <div id="gc-stats">
        <!-- Preserve internal season state; the shared header is the visible selector. -->
        <select id="gcSeason" hidden aria-hidden="true" disabled>
          <option>Loading seasons…</option>
        </select>

        <section class="section" aria-labelledby="gcLeadersTitle">
          <div class="section-top">
            <div>
              <h2 id="gcLeadersTitle">
                BATTING <em>LEADERS</em>
              </h2>
              <div class="section-rule"></div>
            </div>
            <small>CLICK A CATEGORY TO VIEW RANKINGS</small>
          </div>

          <div class="gc-leader-note"
               aria-label="GameChanger statistics coverage and leaderboard qualification">
            <span>Only players with stats recorded in GameChanger appear. Players must have played at least 50% of league games to qualify for AVG, OBP, SLG and OPS leaders.</span>
            <span id="gcQualification"
                  class="gc-min-badge"
                  aria-live="polite">MIN 1 GP</span>
          </div>

          <div id="gcLeaderCards" class="gc-leader-grid"></div>
        </section>

        <section class="section"
                 id="gcBattingSection"
                 aria-labelledby="gcBattingTitle">
          <div class="section-top">
            <div>
              <h2 id="gcBattingTitle">
                COMPLETE <em>BATTING STATS</em>
              </h2>
              <div class="section-rule"></div>
            </div>
          </div>

          <div class="gc-filter-grid">
            <label for="gcTeam">
              TEAM
              <select id="gcTeam" disabled>
                <option>All Teams</option>
              </select>
            </label>

            <label for="gcSort">
              SORT BY
              <select id="gcSort">
                <option value="AVG">Batting Average</option>
                <option value="OBP">On-Base Percentage</option>
                <option value="SLG">Slugging</option>
                <option value="OPS">OPS</option>
                <option value="HR">Home Runs</option>
                <option value="RBI">Runs Batted In</option>
                <option value="H">Hits</option>
                <option value="2B">Doubles</option>
                <option value="3B">Triples</option>
                <option value="PA">Plate Appearances</option>
                <option value="GP">Games Played</option>
              </select>
            </label>

            <label for="gcSearch">
              SEARCH PLAYER
              <input id="gcSearch"
                     type="search"
                     placeholder="Player name">
            </label>
          </div>

          <p class="gc-faint" id="gcMeta">
            Loading player statistics…
          </p>

          <div class="gc-table-wrap">
            <table class="gc-table">
              <thead>
                <tr id="gcHeaders"></tr>
              </thead>
              <tbody id="gcRows"></tbody>
            </table>
          </div>
        </section>

        <section class="section gc-section-spaced"
                 aria-labelledby="gcReportingTitle">
          <div class="section-top">
            <div>
              <h2 id="gcReportingTitle">
                TEAM <em>REPORTING</em>
              </h2>
              <div class="section-rule"></div>
            </div>
          </div>
          <div id="gcReporting" class="gc-team-list"></div>
          <p class="gc-faint" id="gcUpdated"></p>
        </section>
      </div>`;

    wrap.replaceChildren(template.content,footer);
    section = wrap.querySelector('#gc-stats');

    const headers = byId('gcHeaders');
    ['#','Player','Team',...stats].forEach((name,i) =>
      headers.appendChild(
        create(
          'th',
          name,
          i >= 3
            ? (rateStats.has(name) ? 'gc-num gc-rate' : 'gc-num')
            : ''
        )
      )
    );

    byId('gcSeason').addEventListener('change',renderSeason);
    byId('gcTeam').addEventListener('change',renderTable);
    byId('gcSort').addEventListener('change',renderTable);
    byId('gcSearch').addEventListener('input',renderTable);

    loadStats();
    return true;
  }

  // Shared main.js renders the page asynchronously.
  // Replace the page contents after it completes.
  if(!mount()) {
    const app = document.getElementById('app');
    const observer = new MutationObserver(() => {
      if(mount()) observer.disconnect();
    });
    observer.observe(app,{childList:true});
  }
})();
</script>
</body>
</html>
