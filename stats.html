
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06192b">
<meta name="description" content="Sunday Night Lights batting leaders and player statistics, powered by GameChanger.">
<title>Stats | Sunday Night Lights</title>
<link rel="stylesheet" href="css/style.css?v=snl-content-20261104">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
/* These rules only affect the main SNL site's Stats page. */
#gc-stats { color: var(--text, #f7faff); }
#gc-stats .gc-seasonbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  margin:0 0 26px;
  padding:15px 18px;
  background:var(--panel2,#0c2943);
  border:1px solid var(--stroke,#587592);
  border-radius:12px;
}
#gc-stats .gc-seasonbar label {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  font-weight:900;
  color:#d9e5f0;
  letter-spacing:.04em;
}
#gc-stats select,#gc-stats input {
  width:100%;
  min-width:0;
  padding:10px 12px;
  border:1px solid #64809c;
  border-radius:8px;
  background:#06192b;
  color:#fff;
  font:inherit;
  font-size:13px;
}
#gc-stats .gc-seasonbar select {
  width:230px;
  max-width:60vw;
}
#gc-stats .gc-faint {
  color:var(--muted,#a9bfd2);
  font-size:12px;
}
#gc-stats .gc-leader-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:27px;
}
#gc-stats .gc-leader {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  text-align:left;
  min-width:0;
  min-height:218px;
  padding:16px;
  background:linear-gradient(150deg,#173b58,#081e33);
  border:1px solid #4b6b86;
  border-radius:12px;
  color:inherit;
  cursor:pointer;
  transition:border-color .15s,transform .15s;
}
#gc-stats .gc-leader:hover,
#gc-stats .gc-leader:focus-visible {
  border-color:var(--yellow,#ffde19);
  transform:translateY(-2px);
}
#gc-stats .gc-leader:focus-visible {
  outline:2px solid var(--yellow,#ffde19);
  outline-offset:2px;
}
#gc-stats .gc-cat {
  font-size:11px;
  letter-spacing:.075em;
  font-weight:900;
  color:#bed1e4;
  text-transform:uppercase;
}
#gc-stats .gc-top-value {
  font-size:31px;
  font-weight:1000;
  line-height:1.18;
  color:var(--yellow,#ffde19);
  font-variant-numeric:tabular-nums;
  margin:12px 0 4px;
}
#gc-stats .gc-top-player {
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  overflow-wrap:anywhere;
}
#gc-stats .gc-top-team {
  font-size:11px;
  color:#aac0d2;
  margin-top:4px;
}
#gc-stats .gc-runners {
  margin-top:auto;
  padding-top:12px;
  display:grid;
  gap:5px;
}
#gc-stats .gc-runner {
  display:grid;
  grid-template-columns:22px minmax(0,1fr) auto;
  gap:5px;
  align-items:center;
  border-top:1px solid #37546e;
  padding-top:5px;
  font-size:11px;
}
#gc-stats .gc-rank {
  color:#9fb4c9;
  font-weight:900;
}
#gc-stats .gc-runner-name {
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#gc-stats .gc-runner-value {
  color:#f7faff;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
#gc-stats .gc-filter-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  padding:16px;
  margin:0 0 13px;
  border:1px solid #486580;
  border-radius:12px;
  background:var(--panel2,#0c2943);
}
#gc-stats .gc-filter-grid label {
  display:block;
  color:#c5d6e6;
  font-size:12px;
  font-weight:800;
}
#gc-stats .gc-filter-grid label select,
#gc-stats .gc-filter-grid label input {
  display:block;
  margin-top:7px;
}
#gc-stats .gc-note {
  margin:15px 0;
  background:#13334e;
  border-left:3px solid var(--yellow,#ffde19);
  padding:12px 14px;
  border-radius:7px;
  color:#d6e5f1;
  font-size:12px;
  line-height:1.55;
}
#gc-stats .gc-table-wrap {
  overflow-x:auto;
  border:1px solid #486580;
  border-radius:11px;
  background:#0b2943;
}
#gc-stats .gc-table {
  width:100%;
  min-width:880px;
  border-collapse:collapse;
  white-space:nowrap;
  font-size:13px;
}
#gc-stats .gc-table th,
#gc-stats .gc-table td {
  padding:12px 11px;
  border-bottom:1px solid #35536f;
  text-align:left;
}
#gc-stats .gc-table th {
  background:#173c5b;
  color:#f7faff;
  font-size:12px;
}
#gc-stats .gc-table .gc-num {
  text-align:right;
  font-variant-numeric:tabular-nums;
}
#gc-stats .gc-table th.gc-rate {
  color:var(--yellow,#ffde19);
}
#gc-stats .gc-table td.gc-rate,
#gc-stats .gc-table td.gc-player {
  font-weight:850;
}
#gc-stats .gc-table tbody tr:hover {
  background:#193b58;
}
#gc-stats .gc-team-list {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:14px 0 0;
}
#gc-stats .gc-team {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  padding:12px 13px;
  background:var(--panel2,#0c2943);
  border:1px solid #486580;
  border-radius:9px;
  font-size:12px;
}
#gc-stats .gc-team strong {
  font-weight:900;
}
#gc-stats .gc-state {
  font-size:11px;
  color:#bccfe0;
  text-align:right;
}
#gc-stats .gc-state.is-reporting {
  color:#a5e9c2;
}
#gc-stats .gc-error {
  color:#ffd0cb;
}
#gc-stats .gc-section-spaced {
  margin-top:30px;
}

@media(max-width:1000px) {
  #gc-stats .gc-leader-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:700px) {
  #gc-stats .gc-filter-grid {
    grid-template-columns:1fr;
  }
  #gc-stats .gc-team-list {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:480px) {
  #gc-stats .gc-leader-grid,
  #gc-stats .gc-team-list {
    grid-template-columns:1fr;
  }
  #gc-stats .gc-leader {
    min-height:190px;
  }
  #gc-stats .gc-seasonbar label {
    width:100%;
    justify-content:space-between;
  }
  #gc-stats .gc-seasonbar select {
    max-width:65%;
  }
}
</style>
</head>

<body data-page="stats">
<div id="siteHeader"></div>
<main id="app"></main>

<script src="js/data.js?v=snl-content-20261104"></script>
<script src="js/main.js?v=snl-content-20261104"></script>

<script>
(() => {
  'use strict';

  const FEED =
    'https://sundaynightlights.github.io/SNL-Stats-Hub/stats-data.json';

  const stats = [
    'GP','PA','AVG','OBP','SLG','OPS',
    'H','2B','3B','HR','RBI'
  ];

  const rateStats = new Set([
    'AVG','OBP','SLG','OPS'
  ]);

  const categories = [
    ['AVG','Batting Average'],
    ['OBP','On-Base Percentage'],
    ['SLG','Slugging'],
    ['OPS','On-Base + Slugging'],
    ['H','Hits'],
    ['HR','Home Runs'],
    ['RBI','Runs Batted In'],
    ['2B','Doubles']
  ];

  let data = null;
  let section = null;

  const create = (tag, content, className) => {
    const node = document.createElement(tag);

    if (content !== undefined) {
      node.textContent = String(content);
    }

    if (className) {
      node.className = className;
    }

    return node;
  };

  const byId = id =>
    section.querySelector('#' + id);

  const stat = (p, key) => {
    const value = p.stats?.[key];

    return typeof value === 'number' &&
      Number.isFinite(value)
      ? value
      : null;
  };

  const fmt = (p, key) => {
    const value = stat(p, key);

    return value === null
      ? '—'
      : rateStats.has(key)
        ? value.toFixed(3)
        : String(value);
  };

  const season = () =>
    data?.seasons.find(
      s => s.season_id === byId('gcSeason').value
    );

  const sorted = (players, key) =>
    [...players].sort((a, b) => {
      const x = stat(a, key);
      const y = stat(b, key);

      if (x === null) return y === null ? 0 : 1;
      if (y === null) return -1;

      return y - x ||
        String(a.name).localeCompare(String(b.name));
    });

  const addOption = (select, value, label) => {
    const option = create('option', label);
    option.value = value;
    select.appendChild(option);
  };

  function renderLeaders(s) {
    const root = byId('gcLeaderCards');
    root.replaceChildren();

    for (const [key, label] of categories) {
      const ranked = sorted(
        s.players.filter(p => stat(p, key) !== null),
        key
      );

      const hasPositive =
        rateStats.has(key) ||
        ranked.some(p => stat(p, key) > 0);

      const display = hasPositive
        ? ranked.slice(0, 3)
        : [];

      const card = create(
        'button',
        undefined,
        'gc-leader'
      );

      card.type = 'button';

      card.setAttribute(
        'aria-label',
        'Sort batting statistics by ' + label
      );

      card.appendChild(
        create('span', label, 'gc-cat')
      );

      const first = display[0];

      card.appendChild(
        create(
          'strong',
          first ? fmt(first, key) : '—',
          'gc-top-value'
        )
      );

      card.appendChild(
        create(
          'span',
          first
            ? first.name
            : 'No recorded stats yet',
          'gc-top-player'
        )
      );

      card.appendChild(
        create(
          'span',
          first ? first.team : '',
          'gc-top-team'
        )
      );

      const runners = create(
        'div',
        undefined,
        'gc-runners'
      );

      display.slice(1).forEach((p, i) => {
        const line = create(
          'div',
          undefined,
          'gc-runner'
        );

        line.appendChild(
          create('span', '#' + (i + 2), 'gc-rank')
        );

        line.appendChild(
          create('span', p.name, 'gc-runner-name')
        );

        line.appendChild(
          create(
            'span',
            fmt(p, key),
            'gc-runner-value'
          )
        );

        runners.appendChild(line);
      });

      card.appendChild(runners);

      card.addEventListener('click', () => {
        byId('gcSort').value = key;
        renderTable();

        byId('gcBattingSection').scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      });

      root.appendChild(card);
    }
  }

  function renderTable() {
    const s = season();
    if (!s) return;

    const team = byId('gcTeam').value;

    const query = byId('gcSearch').value
      .trim()
      .toLowerCase();

    const key = byId('gcSort').value;

    const players = sorted(
      s.players.filter(p =>
        (!team || p.team_id === team) &&
        String(p.name || '')
          .toLowerCase()
          .includes(query)
      ),
      key
    );

    const tbody = byId('gcRows');
    tbody.replaceChildren();

    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const tr = create('tr');

      tr.appendChild(create('td', i + 1));
      tr.appendChild(
        create('td', p.name, 'gc-player')
      );
      tr.appendChild(create('td', p.team));

      stats.forEach(k => {
        tr.appendChild(
          create(
            'td',
            fmt(p, k),
            rateStats.has(k)
              ? 'gc-num gc-rate'
              : 'gc-num'
          )
        );
      });

      tbody.appendChild(tr);
    }

    if (!players.length) {
      const tr = create('tr');

      const td = create(
        'td',
        'No matching player statistics.'
      );

      td.colSpan = 14;

      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    const count = s.teams.filter(
      t => t.reporting_status === 'stats_available'
    ).length;

    byId('gcMeta').textContent =
      `${players.length} player records · ` +
      `${count} of 6 teams reporting · ` +
      `${s.season_label || s.season_id}`;
  }

  function renderSeason() {
    const s = season();
    if (!s) return;

    renderLeaders(s);

    const teamSelect = byId('gcTeam');
    teamSelect.replaceChildren();

    addOption(
      teamSelect,
      '',
      'All Teams'
    );

    s.teams.forEach(t => {
      addOption(
        teamSelect,
        t.team_id,
        t.name
      );
    });

    const report = byId('gcReporting');
    report.replaceChildren();

    s.teams.forEach(t => {
      const card = create(
        'div',
        undefined,
        'gc-team'
      );

      const available =
        t.reporting_status === 'stats_available';

      card.appendChild(
        create('strong', t.name)
      );

      card.appendChild(
        create(
          'span',
          available
            ? 'Stats available'
            : 'Not submitted',
          'gc-state' +
            (available ? ' is-reporting' : '')
        )
      );

      report.appendChild(card);
    });

    renderTable();
  }

  async function loadStats() {
    try {
      const response = await fetch(
        FEED,
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error(
          'HTTP ' + response.status
        );
      }

      const incoming = await response.json();

      if (
        !Array.isArray(incoming.seasons) ||
        !incoming.seasons.length
      ) {
        throw new Error(
          'No seasons available'
        );
      }

      data = incoming;

      const seasons = byId('gcSeason');
      seasons.replaceChildren();

      data.seasons.forEach(s => {
        addOption(
          seasons,
          s.season_id,
          s.season_label || s.season_id
        );
      });

      seasons.value = data.current_season;

      if (seasons.selectedIndex < 0) {
        seasons.selectedIndex = 0;
      }

      seasons.disabled = false;
      byId('gcTeam').disabled = false;

      const updated = new Date(
        data.generated_at_utc
      );

      if (!Number.isNaN(updated.getTime())) {
        byId('gcUpdated').textContent =
          'Last processed: ' +
          updated.toLocaleString(
            'en-CA',
            { timeZone: 'America/Toronto' }
          );
      }

      renderSeason();

    } catch (error) {
      console.error(
        'SNL GameChanger stats unavailable:',
        error
      );

      byId('gcMeta').textContent =
        'Player batting statistics are temporarily unavailable.';

      byId('gcMeta').classList.add(
        'gc-error'
      );

      byId('gcLeaderCards').textContent =
        'The latest league leaders could not be loaded.';
    }
  }

  function mount() {
    const app = document.getElementById('app');

    const wrap = app.querySelector(
      ':scope > .wrap'
    );

    if (
      !wrap ||
      !wrap.querySelector('.page-hero') ||
      !wrap.querySelector('.footer')
    ) {
      return false;
    }

    // Preserve the SNL header, ticker and footer.
    // Replace the entire old Stats-page content,
    // including the duplicate standings table.

    const footer = wrap.querySelector('.footer');

    const template = document.createElement(
      'template'
    );

    template.innerHTML = `
      <div class="page-hero">
        <div>
          <h1>PLAYER <em>STATS</em></h1>
          <p>
            GameChanger batting leaders and player statistics
          </p>
        </div>
      </div>

      <div id="gc-stats">

        <div class="gc-seasonbar">
          <label for="gcSeason">
            SEASON
            <select id="gcSeason" disabled>
              <option>Loading seasons…</option>
            </select>
          </label>

          <span class="gc-faint">
            Statistics from participating SNL teams
          </span>
        </div>

        <section
          class="section"
          aria-labelledby="gcLeadersTitle">

          <div class="section-top">
            <div>
              <h2 id="gcLeadersTitle">
                BATTING <em>LEADERS</em>
              </h2>
              <div class="section-rule"></div>
            </div>
            <small>
              CLICK A CATEGORY TO VIEW RANKINGS
            </small>
          </div>

          <div
            id="gcLeaderCards"
            class="gc-leader-grid">
          </div>
        </section>

        <section
          class="section"
          id="gcBattingSection"
          aria-labelledby="gcBattingTitle">

          <div class="section-top">
            <div>
              <h2 id="gcBattingTitle">
                COMPLETE <em>BATTING STATS</em>
              </h2>
              <div class="section-rule"></div>
            </div>
          </div>

          <div class="gc-filter-grid">

            <label for="gcTeam">
              TEAM
              <select id="gcTeam" disabled>
                <option>All Teams</option>
              </select>
            </label>

            <label for="gcSort">
              SORT BY
              <select id="gcSort">
                <option value="AVG">Batting Average</option>
                <option value="OBP">On-Base Percentage</option>
                <option value="SLG">Slugging</option>
                <option value="OPS">OPS</option>
                <option value="HR">Home Runs</option>
                <option value="RBI">Runs Batted In</option>
                <option value="H">Hits</option>
                <option value="2B">Doubles</option>
                <option value="3B">Triples</option>
                <option value="PA">Plate Appearances</option>
                <option value="GP">Games Played</option>
              </select>
            </label>

            <label for="gcSearch">
              SEARCH PLAYER
              <input
                id="gcSearch"
                type="search"
                placeholder="Player name">
            </label>
          </div>

          <p class="gc-faint" id="gcMeta">
            Loading player statistics…
          </p>

          <div class="gc-table-wrap">
            <table class="gc-table">
              <thead>
                <tr id="gcHeaders"></tr>
              </thead>
              <tbody id="gcRows"></tbody>
            </table>
          </div>

          <p class="gc-note">
            These GameChanger statistics are voluntarily
            recorded by participating teams.
            Not all teams submit stats.
            Rate-stat leaders currently have
            <strong>no minimum plate-appearance
            requirement</strong>; small samples can
            produce unusually high averages.
          </p>
        </section>

        <section
          class="section gc-section-spaced"
          aria-labelledby="gcReportingTitle">

          <div class="section-top">
            <div>
              <h2 id="gcReportingTitle">
                TEAM <em>REPORTING</em>
              </h2>
              <div class="section-rule"></div>
            </div>
          </div>

          <div
            id="gcReporting"
            class="gc-team-list">
          </div>

          <p class="gc-faint" id="gcUpdated"></p>
        </section>

      </div>
    `;

    wrap.replaceChildren(
      template.content,
      footer
    );

    section = wrap.querySelector('#gc-stats');

    const headers = byId('gcHeaders');

    [
      '#',
      'Player',
      'Team',
      ...stats
    ].forEach((name, i) => {
      headers.appendChild(
        create(
          'th',
          name,
          i >= 3
            ? rateStats.has(name)
              ? 'gc-num gc-rate'
              : 'gc-num'
            : ''
        )
      );
    });

    byId('gcSeason').addEventListener(
      'change',
      renderSeason
    );

    byId('gcTeam').addEventListener(
      'change',
      renderTable
    );

    byId('gcSort').addEventListener(
      'change',
      renderTable
    );

    byId('gcSearch').addEventListener(
      'input',
      renderTable
    );

    loadStats();

    return true;
  }

  // The original SNL website renders asynchronously.
  // Replace only this page's content once it's ready.

  if (!mount()) {
    const app = document.getElementById('app');

    const observer = new MutationObserver(() => {
      if (mount()) {
        observer.disconnect();
      }
    });

    observer.observe(
      app,
      {
        childList: true
      }
    );
  }

})();
</script>
</body>
</html>
